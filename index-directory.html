<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ModernClient - Choose Your Version</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold-light:  #fff5c0;
      --gold:        #f5c842;
      --gold-mid:    #d4a017;
      --gold-dark:   #8b6914;
      --white-pure:  #ffffff;
      --white-glow:  rgba(255, 255, 255, 0.85);
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Cinzel', serif;
      min-height: 100vh;
      background: linear-gradient(180deg,
        #ffffff 0%,
        #fff9e6 35%,
        #fce87a 70%,
        #f5c842 100%
      );
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .rays {
      position: fixed;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 200vw;
      height: 110vh;
      pointer-events: none;
      z-index: 0;
      background: conic-gradient(
        from 180deg at 50% 0%,
        transparent 0deg,
        rgba(255,245,160,0.18) 5deg,
        transparent 10deg,
        rgba(255,245,160,0.12) 16deg,
        transparent 22deg,
        rgba(255,245,160,0.20) 28deg,
        transparent 34deg,
        rgba(255,245,160,0.10) 40deg,
        transparent 48deg,
        rgba(255,245,160,0.22) 54deg,
        transparent 60deg,
        rgba(255,245,160,0.14) 66deg,
        transparent 72deg,
        rgba(255,245,160,0.18) 78deg,
        transparent 84deg,
        rgba(255,245,160,0.12) 90deg,
        transparent 180deg
      );
      animation: rayRotate 40s linear infinite;
      opacity: 0.9;
    }

    @keyframes rayRotate {
      from { transform: translateX(-50%) rotate(0deg); }
      to   { transform: translateX(-50%) rotate(360deg); }
    }

    .container {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--gold-dark);
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }

    .subtitle {
      font-size: 1.2rem;
      color: var(--gold-dark);
      margin-bottom: 3rem;
      opacity: 0.9;
    }

    .options {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 2rem;
    }

    .option {
      background: linear-gradient(135deg, var(--white-pure) 0%, var(--gold-light) 100%);
      border: 3px solid var(--gold-mid);
      border-radius: 15px;
      padding: 2rem;
      width: 280px;
      text-decoration: none;
      color: var(--gold-dark);
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(139, 105, 20, 0.2);
      cursor: pointer;
    }

    .option:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(139, 105, 20, 0.4);
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
    }

    .option h2 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .option p {
      font-size: 0.95rem;
      opacity: 0.8;
      margin-bottom: 1rem;
    }

    .option-badge {
      display: inline-block;
      background: var(--gold-mid);
      color: white;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-top: 0.5rem;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      .options {
        flex-direction: column;
        align-items: center;
      }

      .option {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="rays"></div>

  <div class="container">
    <h1>ModernClient</h1>
    <p class="subtitle">Choose your Minecraft experience</p>

    <div class="options">
      <a href="/index.html" class="option">
        <h2>🌐 WebAssembly</h2>
        <p>Fast and modern WASM-based client</p>
        <span class="option-badge">WASM-GC 1.12</span>
      </a>

      <a href="/javascript/index.html" class="option">
        <h2>☕ Java Edition</h2>
        <p>Traditional JavaScript-compiled client</p>
        <span class="option-badge">Java 1.12.2</span>
      </a>
    </div>
  </div>
</body>
</html>
